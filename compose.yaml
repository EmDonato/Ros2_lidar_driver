services:
  drivers:
    image: robot-modules/drivers:humble
    build:
      context: ..
      dockerfile: drivers/Dockerfile
    network_mode: host
    ipc: host
    privileged: true
    volumes:
      - /dev:/dev
      - /run/udev:/run/udev:ro
    environment:
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
    command: sleep infinity
