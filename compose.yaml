services:
  lidar_driver:
    image: open-pi-lidar-driver-img
    platform: ${ROBOT_PLATFORM:-linux/arm64}
    container_name: open-pi-lidar-driver
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USERNAME: lidar
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    network_mode: host
    privileged: true
    volumes:
      - /dev:/dev
      - /run/udev:/run/udev:ro
      - ./config:/ws/config:ro
    environment:
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
